<!DOCTYPE html>

<head>

       written by scripts/build/prerender.mjs out of content/content.js, so
       these two are what you see opening the file directly. -->

    content="Alice Jiang is a Jerome Fisher M&amp;T student at the University of Pennsylvania studying finance and computer science, interested in investment banking and early-stage venture, and building small software projects on the side.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://weiranjiang.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alice Jiang">
  <meta property="og:description"
    content="Finance and computer science at Penn. Investment banking, early-stage venture, and small software projects.">
  <script src="scripts/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=Inter:wght@400;450;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/images/avatar.svg" type="image/svg+xml">
  <link rel="icon" href="assets/images/avatar-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/avatar-180.png">
</head>

<body>
  <a class="visually-hidden skip-link" href="#main">Skip to content</a>

  <header class="site-header">

      <a class="brand" href="#top">(Weiran) Alice Jiang</a>
      <nav class="site-nav" id="site-nav" aria-label="Sections"></nav>

  <main id="main">
    <div id="top"></div>

    <!-- 1. Introduction -->
    <section class="intro wrap" id="intro"></section>

    <!-- 2–6. Rendered from content/content.js -->
    <div id="sections"></div>

  <footer class="site-footer">
    <div class="wrap">
      <span id="footer-note">Alice Jiang</span>
      <span><a href="mailto:wajiang@wharton.upenn.edu">wajiang@wharton.upenn.edu</a></span>
    </div>

  <!-- Assistant. Mounted by scripts/assistant.js; the character artwork comes
       from scripts/character.js and can be swapped without touching the chat. -->

  <script src="scripts/config.js"></script>
  <script type="module" src="scripts/main.js"></script>
